[project]
name = "fantasy-football-api-server"
version = "0.1.0"
description = "Fantasy football data aggregation and API server"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "django>=5.2,<6.0",
    "django-cors-headers>=4.7,<5.0",
    "django-shinobi>=1.4,<2.0",
    "python-dotenv>=1.1,<2.0",
]

[dependency-groups]
dev = [
    "pylint>=3.3,<4.0",
    "pylint-django>=2.6,<3.0",
    "pytest>=8.3,<9.0",
    "pytest-django>=4.11,<5.0",
]

[tool.pylint.main]
django-settings-module = "fantasy_api.settings"
load-plugins = ["pylint_django"]
ignore-paths = [".venv"]
persistent = false

[tool.pylint.design]
max-attributes = 8

[tool.pylint.format]
max-line-length = 88

[tool.pylint.messages_control]
disable = [
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    # Django intentionally delays this import until the command is invoked.
    "import-outside-toplevel",
]

[tool.pytest.ini_options]
addopts = "-v"
DJANGO_SETTINGS_MODULE = "fantasy_api.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Support for class-based `config` is deprecated.*:pydantic.PydanticDeprecatedSince20:ninja\\..*",
]
